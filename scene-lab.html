<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>场景资源 · 四魂初旅</title><link rel="stylesheet" href="./styles.css">
  <style>
    .scene-shell{max-width:1220px;margin:auto;padding:28px 30px 50px}.scene-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:20px;border-bottom:1px solid var(--line)}.scene-heading small{font:9px var(--sans);letter-spacing:3px;color:var(--gold)}.scene-heading h1{font:29px var(--serif);letter-spacing:5px;margin:8px 0 0}.scene-heading a{font-size:11px;color:var(--gold)}.scene-intro{color:var(--muted);font-size:12px;line-height:1.9;margin:17px 0}.scene-controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:16px 0}.scene-controls .button{font-size:11px;min-height:35px;padding:9px 13px;letter-spacing:1px}.scene-controls .button[aria-pressed="true"]{background:#d6b887;color:#182525;border-color:#d6b887}.scene-controls label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px}.scene-controls select{background:#1d2c2b;border:1px solid #a0ac8055;color:var(--text);padding:9px;font:11px var(--sans)}.scene-controls .spacer{flex:1}.scene-stage{width:min(100%,calc((100dvh - 285px) * 1.77778));margin:auto;aspect-ratio:16/9;border:1px solid #d6b88766;background:#122325}.scene-stage canvas{width:100%;height:100%;display:block;image-rendering:pixelated;outline-offset:4px}.scene-position{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--muted);margin-top:14px}.scene-position input{flex:1;accent-color:var(--gold);min-width:0}.scene-position output{min-width:105px;text-align:right;color:var(--gold)}.scene-status{min-height:20px;color:var(--green);font-size:11px;margin:10px 0 25px}.scene-library-heading{display:flex;align-items:baseline;justify-content:space-between;gap:15px;border-top:1px solid var(--line);padding-top:22px}.scene-library-heading h2{font:20px var(--serif);font-weight:400;letter-spacing:3px;margin:0}.scene-library-heading span{font-size:10px;color:var(--muted)}.scene-library{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:18px}.scene-card{border:1px solid #bbba8830;background:linear-gradient(150deg,#283a3588,#132022);padding:16px}.scene-card canvas{width:100%;height:190px;object-fit:contain;display:block;image-rendering:pixelated;border-bottom:1px solid var(--line)}.scene-card h3{font:19px var(--serif);font-weight:400;letter-spacing:3px;margin:14px 0 8px;color:#e1cfab}.scene-card p{font-size:11px;line-height:1.8;color:var(--muted);margin:0}.scene-card .scene-number{float:right;font:12px Georgia;color:#c1ae7f77;margin-top:4px}@media(max-width:720px){.scene-shell{padding:20px 14px}.scene-heading h1{font-size:23px;letter-spacing:3px}.scene-library{grid-template-columns:1fr 1fr;gap:10px}.scene-card{padding:12px}.scene-card canvas{height:140px}.scene-stage{width:100%}.scene-controls .spacer{display:none}.scene-library-heading span{display:none}.scene-position output{min-width:65px}.scene-card h3{font-size:16px}}
  </style>
</head>
<body><main class="scene-shell">
  <header class="scene-heading"><div><small>ENVIRONMENT · 场景资源</small><h1>森林、村落与鸟居</h1></div><a href="./index.html">返回主线 →</a></header>
  <p class="scene-intro">查看场景资源在关卡中的组合与角色比例。A / D 移动，空格跳跃；走到木门前按 E / Enter 开关。下方可单独查看每种素材。本页使用临时进度。</p>
  <div class="scene-controls" aria-label="场景选择">
    <button class="button secondary" data-scene-view="opening" aria-pressed="true">井与神木</button><button class="button secondary" data-scene-view="forest" aria-pressed="false">林间道路</button><button class="button secondary" data-scene-view="village" aria-pressed="false">村口人家</button><button class="button secondary" data-scene-view="shrine" aria-pressed="false">神社门</button><button class="button secondary" data-scene-view="night" aria-pressed="false">幽暗岩台</button><button class="button secondary" data-scene-view="yura" aria-pressed="false">赤骸之巢</button>
    <span class="spacer"></span><label>角色 <select id="scene-hero"><option value="kagome">戈薇</option><option value="inuyasha">犬夜叉</option></select></label><label><input id="scene-hitboxes" type="checkbox"> 碰撞边缘</label><button class="button secondary" id="scene-door">查看开门</button>
  </div>
  <div class="scene-stage"><canvas id="scene-game" width="960" height="540" tabindex="0" aria-label="场景预览，可用A D移动和空格跳跃"></canvas></div>
  <label class="scene-position">沿道路查看 <input id="scene-position" type="range" min="80" max="6000" value="140" step="1" aria-label="角色在关卡中的位置"><output id="scene-coordinate">140 / 6200</output></label>
  <p class="scene-status" id="scene-status" role="status">正在载入场景资源…</p>
  <div class="scene-library-heading"><h2>基本场景单元</h2><span>独立透明素材 · 与主线共用渲染</span></div>
  <section class="scene-library" id="scene-library" aria-label="场景素材"></section>
</main><script type="module" src="./src/scene-lab.js"></script></body>
</html>
