  <script type="application/json" id="shikon-timeline-data">{"routes":[{"key":"hero","name":"主角线","version":"v0.1","stages":[{"index":1,"name":"玉碎与启程","main":[{"id":"犬主01","title":"封印与玉碎","episodes":"1～2","source":"动画节点改编","detail":"穿越、解封与玉碎，建立寻找碎片的目标。","world":"M01"},{"id":"犬主02","title":"逆发之森","episodes":"3～4","source":"动画节点改编","detail":"与戈薇合作识破结罗，争取保住或夺回碎片。","world":"M02"},{"id":"犬主03","title":"父亲的墓地","episodes":"5～7","source":"动画节点改编","detail":"面对杀生丸，取得铁碎牙并明确兄弟矛盾。","world":"M03"},{"id":"犬主04","title":"狐火与雷兽","episodes":"9～10","source":"动画节点改编","detail":"帮助七宝对抗雷兽兄弟，七宝随后同行。","world":"M04"},{"id":"犬主05","title":"无月之夜","episodes":"13","source":"动画节点改编","detail":"经历朔夜与蜘蛛头，理解半妖弱点及同伴保护。","world":"M05"}],"side":[{"id":"犬支01","title":"城中的妖蛤","episodes":"正8","detail":"救援城中人物、处理持玉妖怪；若配置真实碎片，另审可选路径与后续归属。","source":"支线待审核"},{"id":"犬支02","title":"能面的诅咒","episodes":"正11","detail":"处理现代能面异闻，补充碎片影响与戈薇家庭生活。","source":"支线待审核"},{"id":"犬支03","title":"小恶灵的安魂","episodes":"正12","detail":"救助亡灵、展开亲情与安魂，不承担通关唯一前置。","source":"支线待审核"}],"goal":"与戈薇合作，理解碎片危险，获得最初伙伴与武器。","people":"犬夜叉、戈薇、枫为开篇核心；冥加、杀生丸、邪见登场；七宝在雷兽事件后同行。","growth":"铁碎牙获得与变化；朔夜是限制，不直接当作新强化。"},{"index":2,"name":"宿怨与同行","main":[{"id":"犬主06","title":"复苏的巫女","episodes":"14～15","source":"动画节点改编","detail":"阻止复活仪式，面对桔梗归来与灵魂牵连。","world":"M06"},{"id":"犬主07","title":"风穴的诅咒","episodes":"16～17","source":"动画节点改编","detail":"与弥勒从冲突转为同行，明确其家族诅咒。","world":"M07"},{"id":"犬主08","title":"借来的妖手","episodes":"18～19","source":"动画节点改编","detail":"应对杀生丸与最猛胜，认识风穴的克制关系。","world":"M08"},{"id":"犬主09","title":"五十年前的骗局","episodes":"20～23","source":"动画节点改编","detail":"追查鬼蜘蛛，理解犬夜叉与桔梗被离间的原因。","world":"M09"},{"id":"犬主10","title":"退治村的灾难","episodes":"24～25","source":"动画节点改编","detail":"结识珊瑚、琥珀、云母，识破嫁祸，建立同行关系。","world":"M10"},{"id":"犬主11","title":"翠子的洞窟","episodes":"26","source":"动画节点改编","detail":"了解玉的起源、净化与污染的背景。","world":"M11"},{"id":"犬主12","title":"琥珀之命","episodes":"29～30","source":"动画节点改编","detail":"面对碎片续命与盗刀胁迫，救援珊瑚姐弟。","world":"M12"}],"side":[{"id":"犬支04","title":"污墨 ource":"游戏原创补充","detail":"扩展第一篇未展开的额外记忆与执念，不重复必需身世主干，也不承担无双或赤子主线的唯一前置。","world":"原新编N04"}]}],"origin":[{"order":1,"title":"火伤的野盗","detail":"鬼蜘蛛被火烧成重伤，濒死且行动受限，作为奈落线的起点；纵火经过与具体演出待细化。"},{"order":2,"title":"洞窟中的巫女","detail":"桔梗照顾鬼蜘蛛，展现她的善意与鬼蜘蛛逐渐滋生的欲望。"},{"order":3,"title":"万妖吞噬","detail":"鬼蜘蛛让妖怪吞噬自己的身体与灵魂，奈落由此诞生；具体妖怪数量不另作游戏数值。"},{"order":4,"title":"伪装与夺玉","detail":"奈落变成犬夜叉的模样，袭击桔梗并抢夺四魂之玉，制造背叛与仇恨。"},{"order":5,"title":"封印与焚玉","detail":"为衔接后世，简述双方遭到挑拨、犬夜叉被封印，桔梗死后与玉一同火化的旧日结局。挑拨双方的具体演出后续细化。"},{"order":6,"title":"五十年后的玉碎","detail":"用剧情时间跳转承接戈薇到来、犬夜叉解封、玉重新出现及破碎；“等待玉碎”在这里表现。"},{"order":7,"title":"收集的开端","detail":"开启碎片争夺与收集目标，接上第一条线索或首次夺玉任务，再进入奈主02。具体持玉者和份额待配置。"}],"periods":["正篇1～13集","正篇14～30集","正篇31～42集","正篇43～81集","正篇82～126集","正篇127～167集","完结篇1～6集","完结篇7～15集","完结篇16～20集","完结篇21～26集素材重排"]}</script>
  <script>
    (() => {
      const root = document.getElementById("shikon-story-review");
      const data = JSON.parse(root.querySelector("#shikon-timeline-data").textContent);
      const chart = root.querySelector(".st-chart");
      const hero = data.routes.find(route => route.key === "hero");
      const naraku = data.routes.find(route => route.key === "naraku");
      const live = root.querySelector(".st-live");
      const dataVersion = "hero-v0.1-naraku-v0.2";
      const nGrowth = [
        "鬼蜘蛛 → 奈落；伪装夺玉；旧日完整玉不触发胜负。",
        "蔭刀伪装、最猛胜与琥珀续命；交易对象不自动入队。",
        "神乐与神无正式活动；分身登场不等于自动可操作。",
        "无双分离与回收；神乐异心；据点被破。",
        "身体重组、新生奈落、分离赤子。",
        "白童子、不妖璧与藏心；合成妖怪与魍魉丸。",
        "再吸收赤子、魍魉丸；白夜登场。",
        "面对净化与遗愿，分身控制关系继续变化。",
        "曲灵属于玉的邪念；围绕琥珀继续争夺。",
        "最后争夺与集齐同步；奈落胜利结局为游戏改编。"
      ];
      const make = (tag, className, text) => {
        const el = document.createElement(tag);
        if (className) el.className = className;
        if (text !== undefined) el.textContent = text;
        return el;
      };
      const phaseSide = stage => naraku.sideSeries.filter(item => {
        const nums = (item.availability.match(/\d+/g) || []).map(Number);
        if (!nums.length) return false;
        const end = nums[1] || (item.availability.includes("起") ? 10 : nums[0]);
        return stage >= nums[0] && stage <= end;
      });
      const sourceLabel = item => {
        if (item.id === "奈主01") return "开篇主干已确认 · 演出待细化";
        if (item.source.includes("结局")) return "结局改编 · 待审核";
        if (item.source.includes("补写") || item.source.includes("原创")) return "任务补写 · 待审核";
        return item.id.includes("支") ? "可选支线 · 待审核" : "主线事件 · 待审核";
      };
      const originList = beats => {
        const list = make("ol", "st-origin");
        beats.forEach(beat => {
          const item = make("li");
          item.append(make("strong", "", beat.title), make("p", "", beat.detail));
          list.append(item);
        });
        return list;
      };
      const eventNode = (item, stage, route, side) => {
        const listItem = make("li");
        const details = make("details", "st-event");
        details.id = "st-" + stage + "-" + route + "-" + item.id;
        details.dataset.eventId = item.id;
        const summary = make("summary", "cursor-interaction");
        const title = item.title + (item.id === "奈主01" ? "（玉碎后接续）" : "");
        summary.append(make("span", "st-event-id text-small", item.id), make("span", "st-event-title", title));
        const body = make("div", "st-event-body");
        body.append(make("p", "text-small", (side ? "支线" : "主线") + " · " + sourceLabel(item)));
        body.append(make("p", "text-small", "动画素材：" + item.episodes));
        if (item.availability) body.append(make("p", "text-small", "开放范围：" + item.availability));
        body.append(make("p", "", item.detail));
        if (item.id === "奈主01") body.append(originList(data.origin.slice(5)));
        if (item.source) body.append(make("p", "text-small st-subtitle", "依据：" + item.source));
        details.append(summary, body);
        listItem.append(details);
        return listItem;
      };
      const metadata = (label, text) => {
        const line = make("p", "st-meta text-small");
        line.append(make("span", "st-meta-label", label), document.createTextNode("　" + text));
        return line;
      };
      const laneNode = (stage, key) => {
        const source = key === "hero" ? hero : naraku;
        const sides = key === "hero" ? stage.side : phaseSide(stage.index);
        const lane = make("section", "st-lane " + key);
        lane.setAttribute("aria-label", source.name + "第" + stage.index + "阶段");
        lane.append(make("h3", "", source.name + " · " + stage.name));
        lane.append(make("p", "st-meta", stage.goal));
        lane.append(metadata("人物", stage.people));
        lane.append(metadata("成长与变化", key === "hero" ? stage.growth : nGrowth[stage.index - 1]));
        lane.append(make("div", "text-small st-subtitle", "主线 · " + stage.main.length + "篇"));
        const list = make("ol", "st-list");
        stage.main.forEach(item => list.append(eventNode(item, stage.index, key, false)));
        lane.append(list);
        if (sides.length) {
          const details = make("details", "st-side-group");
          details.id = "st-" + stage.index + "-" + key + "-side";
          const cross = key === "naraku" && sides.some(item => item.availability.includes("～") || item.availability.includes("起"));
          details.append(make("summary", "cursor-interaction", "支线 · " + sides.length + "条" + (cross ? "（含跨阶段系列）" : "")));
          const sideList = make("ol", "st-list");
          sides.forEach(item => sideList.append(eventNode(item, stage.index, key, true)));
          details.append(sideList);
          lane.append(details);
        } else lane.append(make("p", "st-empty text-small", "本阶段未另设支线。"));
        return lane;
      };
      const node = (name, subtitle, key) => {
        const el = make("span", "st-node " + key);
        el.append(make("span", "st-route-small text-small", key === "hero" ? "主角线" : "奈落线"));
        el.append(make("span", "st-node-title", name), make("div", "st-node-sub text-small", subtitle));
        return el;
      };
      const stageNode = (index, label, period, heroNode, narakuNode, body) => {
        const details = make("details", "st-stage");
        details.id = "st-phase-" + index;
        details.dataset.stage = String(index);
        const summary = make("summary", "st-stage-summary cursor-interaction");
        const time = make("span", "st-time text-small");
        const caret = make("span", "st-caret", "›");
        caret.setAttribute("aria-hidden", "true");
        time.append(make("span", "st-stage-number", label), make("span", "", period), caret);
        summary.append(time, heroNode, narakuNode);
        details.append(summary, body);
        return details;
      };
      const pastBody = make("div", "st-stage-body");
      const pastHero = make("section", "st-lane hero");
      pastHero.setAttribute("aria-label", "主角线前史");
      pastHero.append(make("h3", "", "主角线 · 背景回顾"));
      pastHero.append(make("p", "", "桔梗与犬夜叉遭到离间，犬夜叉被封印；桔梗死后与玉一同焚化。"));
      pastHero.append(make("p", "text-small st-subtitle", "在开篇或后续真相揭露中交代，不新增主角主线篇章。"));
      const pastNaraku = make("section", "st-lane naraku");
      pastNaraku.setAttribute("aria-label", "奈落诞生前史");
      pastNaraku.append(make("h3", "", "奈主01 · 前史段落"), make("div", "text-small", "用户已确认主干"), originList(data.origin.slice(0, 5)));
      pastBody.append(pastHero, pastNaraku);
      chart.append(stageNode(0, "前史", "五十年前", node("封印前的因缘", "桔梗、犬夜叉 · 背景回顾", "hero"), node("奈主01 · 奈落诞生", "火伤 → 照顾 → 吞噬 → 伪装夺玉", "naraku"), pastBody));
      chart.append(make("div", "st-jump text-small", "五十年后 · 戈薇到来 · 四魂之玉重现、破碎 · 正式争夺开始 ↓"));
      hero.stages.forEach((h, index) => {
        const n = naraku.stages[index];
        const body = make("div", "st-stage-body");
        body.append(laneNode(h, "hero"), laneNode(n, "naraku"));
        const hSub = h.main[0].id + "～" + h.main[h.main.length - 1].id + " · " + h.main.length + "篇主线";
        const nSub = n.main[0].id + "～" + n.main[n.main.length - 1].id + " · " + n.main.length + "篇主线";
        chart.append(stageNode(index + 1, "阶段" + (index + 1), data.periods[index], node(h.name, hSub, "hero"), node(n.name, nSub, "naraku"), body));
      });
      const stages = [...root.querySelectorAll(".st-stage")];
      const readState = globals => {
        const candidate = globals?.privateContent?.shikonTimeline || globals?.shikonTimeline;
        return candidate?.version === dataVersion ? candidate : null;
      };
      const restore = state => {
        const active = state && Number.isInteger(state.stage) && state.stage >= -1 && state.stage <= 10 ? state.stage : 1;
        const inner = new Set(Array.isArray(state?.openDetails) ? state.openDetails : []);
        stages.forEach(stage => { stage.open = Number(stage.dataset.stage) === active; });
        root.querySelectorAll(".st-event, .st-side-group").forEach(details => { details.open = inner.has(details.id); });
      };
      restore(readState(window.openai?.widgetState));
      const save = selected => {
        const active = stages.find(stage => stage.open);
        const state = {
          version: dataVersion,
          stage: active ? Number(active.dataset.stage) : -1,
          openDetails: [...root.querySelectorAll(".st-event[open], .st-side-group[open]")].map(el => el.id)
        };
        const payload = {
          modelContent: { timeline: "犬夜叉与奈落双时间轴", stage: state.stage, selectedChapter: selected?.dataset.eventId || null, protagonistVersion: hero.version, narakuVersion: naraku.version },
          privateContent: { shikonTimeline: state }
        };
        try {
          const pending = window.openai?.setWidgetState?.(payload);
          if (pending && typeof pending.catch === "function") pending.catch(() => {});
        } catch (_) {}
      };
      root.addEventListener("click", event => {
        const summary = event.target.closest("summary");
        if (!summary || !root.contains(summary)) return;
        const details = summary.parentElement;
        if (details.tagName !== "DETAILS") return;
        event.preventDefault();
        const next = !details.open;
        if (details.classList.contains("st-stage")) {
          stages.forEach(stage => { stage.open = stage === details && next; });
          const index = Number(details.dataset.stage);
          live.textContent = next ? (index === 0 ? "已展开两个时间轴的五十年前背景。" : "已展开阶段" + index + "的主角线与奈落线。") : "已折叠当前阶段。";
        } else details.open = next;
        save(details);
      });
      window.addEventListener("openai:set_globals", event => {
        const globals = event.detail?.globals;
        if (globals && Object.prototype.hasOwnProperty.call(globals, "widgetState")) {
          const state = readState(globals.widgetState);
          if (state) restore(state);
        }
      });
    })();
  </script>
</div>
