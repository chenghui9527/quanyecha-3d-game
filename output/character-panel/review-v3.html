<section role="tabpanel" id="equipment-v2" aria-labelledby="tab-equipment-v2" hidden><figure><img src="character-equipment-v2.png" width="1672" height="941" alt="部位装备格新版：公用道具为旅途手记一级菜单，人物周围分布头部、衣装、手部、饰物、武器和足部六格，右侧展示选中铁碎牙的专属归属与更换入口。"><figcaption><span><strong>公用道具独立管理，人物专属装备按部位选择。</strong><br>六个部位格围绕人物，选中后右侧查看详情；空位显示轮廓。安全地点可进入对应部位的更换清单，战斗区域锁定。部位数量与初始衣装仍为设计提案。</span><a href="character-equipment-v2.png" target="_blank" rel="noopener">查看 v2 原图 ↗</a></figcaption></figure></section>

</main><script>
const tabs=[...document.querySelectorAll('[role="tab"]')];
function select(tab,focus=false){for(const candidate of tabs){const active=candidate===tab;candidate.setAttribute('aria-selected',String(active));candidate.tabIndex=active?0:-1;document.getElementById(candidate.getAttribute('aria-controls')).hidden=!active;}if(focus)tab.focus();}
tabs.forEach((tab,index)=>{tab.addEventListener('click',()=>select(tab));tab.addEventListener('keydown',event=>{let next;if(event.key==='ArrowRight')next=(index+1)%tabs.length;else if(event.key==='ArrowLeft')next=(index+tabs.length-1)%tabs.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=tabs.length-1;else return;event.preventDefault();select(tabs[next],true);});});
</script></body></html>
