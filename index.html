<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#071a21">
  <meta name="description" content="犬夜叉主题精细像素风横版动作冒险。穿过食骨之井，与犬夜叉和戈薇一同踏上寻找四魂之玉的旅途。">
  <title>犬夜叉 · 四魂初旅</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23131f20'/%3E%3Cpath d='M32 8 50 32 32 56 14 32Z' fill='%23d9b985'/%3E%3Cpath d='M32 18 41 32 32 46 23 32Z' fill='%237ca891'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./home.css">
  <link rel="stylesheet" href="./factions.css">
  <link rel="stylesheet" href="./battle.css">
</head>
<body class="game-app">
  <div class="app-shell" id="app-shell">
    <main class="game-stage" id="stage" aria-label="游戏场景">
      <section class="home-screen" id="home-screen" aria-label="四魂初旅主菜单">
        <div class="home-shade" aria-hidden="true"></div>
        <div class="home-atmosphere" aria-hidden="true">
          <i style="--x:5%;--y:57%;--delay:-2s"></i><i style="--x:17%;--y:78%;--delay:-6s"></i>
          <i style="--x:30%;--y:69%;--delay:-4s"></i><i style="--x:42%;--y:42%;--delay:-9s"></i>
          <i style="--x:55%;--y:80%;--delay:-1s"></i><i style="--x:66%;--y:32%;--delay:-7s"></i>
          <i style="--x:77%;--y:78%;--delay:-5s"></i><i style="--x:92%;--y:59%;--delay:-3s"></i>
          <span class="forest-leaf" style="--x:48%;--delay:-3s"></span><span class="forest-leaf" style="--x:83%;--delay:-9s"></span>
        </div>
        <nav class="screen-tools" aria-label="显示、声音与设置">
          <button class="screen-tool" id="fullscreen-button" data-fullscreen-toggle aria-label="进入全屏" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 8 3 3m13 5 5-5M8 16l-5 5m13-5 5 5"/></svg><span class="fullscreen-label">全屏</span></button>
          <button class="screen-tool" id="sound-button" data-sound-toggle aria-label="关闭声音" aria-pressed="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-5v16l-5-5H3Z"/><g class="sound-waves"><path d="M16 7a7 7 0 0 1 0 10m3-13a11 11 0 0 1 0 16"/></g><path class="sound-muted-mark" d="m16 9 6 6m0-6-6 6"/></svg><span class="sound-label">声音</span></button>
          <button class="screen-tool" id="help-button"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 1 3h4l2-2 3 1 2-3 2-1-1-4-2-1-1-3-3-1-1-3Z"/><circle cx="11.8" cy="11.8" r="3.3"/></svg><span>设置</span></button>
        </nav>
        <div class="home-copy">
          <h1 class="title-logo"><span class="sr-only">犬夜叉 · 四魂初旅</span></h1>
          <div class="title-rule" aria-hidden="true"><span>◇</span></div>
          <p class="home-subtitle">穿过食骨之井，赴一场五百年的约定。</p>
          <nav class="home-menu" aria-label="开始或继续旅程">
            <button class="home-menu-item is-selected" id="play-button"><span id="play-label">开始旅程</span></button>
            <button class="home-menu-item" id="new-game-button" hidden>新的旅程</button>
            <button class="home-menu-item" id="chapter-button">选择章节</button>
          </nav>
        </div>
        <nav class="home-links" aria-label="旅程档案">
          <button id="nav-heroes"><svg class="ui-icon" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="8" r="4"/><path d="M5 25v-3a9 9 0 0 1 18 0v3ZM6 6a4 4 0 0 0-1 7m-1 3a7 7 0 0 0-3 6v2h4M22 6a4 4 0 0 1 1 7m1 3a7 7 0 0 1 3 6v2h-4"/></svg><span>伙伴</span></button>
          <button id="nav-jewel"><svg class="ui-icon" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11"/><path d="m14 7 5 7-5 7-5-7Zm-5-5 2 4m10-1-3 3M4 12l4 1"/></svg><span>四魂之玉</span></button>
          <button id="nav-bestiary"><svg class="ui-icon" viewBox="0 0 28 28" aria-hidden="true"><path d="m5 9-1-6 7 4m12 2 1-6-7 4M4 12a10 10 0 0 1 20 0v6l-5 7H9l-5-7Zm3 2 4 2m10-2-4 2m-6 5 3-2 3 2"/></svg><span>妖怪图鉴</span></button>
        </nav>
        <div class="home-caption"><span>第一阶段 · 玉碎与启程</span><i aria-hidden="true"></i></div>
        <p class="home-save-status" id="save-status">进度自动保存</p>
      </section>
      <section class="faction-screen" id="faction-screen" aria-labelledby="faction-heading" hidden>
        <header class="faction-header">
          <button class="faction-back" id="faction-back"><span aria-hidden="true">‹</span> 返回主界面</button>
          <div class="faction-heading-group"><h2 id="faction-heading">选择你的阵营</h2><p>同一颗四魂之玉，两条不同的旅途。</p></div>
          <button class="screen-tool faction-sound" data-sound-toggle aria-label="关闭声音" aria-pressed="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-5v16l-5-5H3Z"/><g class="sound-waves"><path d="M16 7a7 7 0 0 1 0 10m3-13a11 11 0 0 1 0 16"/></g><path class="sound-muted-mark" d="m16 9 6 6m0-6-6 6"/></svg><span class="sound-label sr-only">声音</span></button>
        </header>
        <div class="faction-options" role="radiogroup" aria-label="旅程所属阵营">
          <button class="faction-card is-selected" id="faction-inuyasha" data-faction="inuyasha" role="radio" aria-checked="true" aria-describedby="faction-inuyasha-description" tabindex="0">
            <span class="faction-art" aria-hidden="true"></span>
            <span class="faction-status"><span aria-hidden="true">◇</span> 已开放 · 前三篇</span>
            <span class="faction-selected-mark" aria-hidden="true">◆</span>
            <span class="faction-caption"><span class="faction-name">犬夜叉阵营</span><span class="faction-description" id="faction-inuyasha-description">守护同伴，踏上寻玉之旅。</span><span class="faction-opening">开篇：封印与玉碎</span></span>
          </button>
          <span class="faction-divider" aria-hidden="true"><i></i><span>◇</span><i></i></span>
          <button class="faction-card faction-naraku" id="faction-naraku" data-faction="naraku" role="radio" aria-checked="false" aria-describedby="faction-naraku-description" tabindex="-1">
            <span class="faction-art" aria-hidden="true"></span>
            <span class="faction-status"><span aria-hidden="true">◇</span> 筹备中</span>
            <span class="faction-selected-mark" aria-hidden="true">◆</span>
            <span class="faction-caption"><span class="faction-name">奈落阵营</span><span class="faction-description" id="faction-naraku-description">从鬼蜘蛛的旧事，走向夺玉之局。</span><span class="faction-opening">开篇：奈落诞生</span></span>
          </button>
        </div>
        <footer class="faction-actions"><button class="faction-start" id="faction-start">开启犬夜叉篇 <span aria-hidden="true">→</span></button><p id="faction-note" role="status" aria-live="polite">阵营将在本次旅程中固定。</p></footer>
      </section>
      <div class="battle-frame" id="battle-frame" hidden>
        <canvas id="game" width="960" height="540" tabindex="0" aria-label="游戏画面，A D移动，空格跳跃，J攻击，S加J上挑或空中下砸，K闪避，U I技能，1 2切换"></canvas>
        <div class="game-hud" id="hud" hidden>
          <div class="party" id="party" aria-label="出战角色与伙伴"></div>
          <div class="hud-corner">
            <nav class="battle-tools" aria-label="战斗显示与声音">
              <button class="battle-tool" data-fullscreen-toggle aria-label="进入全屏" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 8 3 3m13 5 5-5M8 16l-5 5m13-5 5 5"/></svg><span class="fullscreen-label sr-only">全屏</span></button>
              <button class="battle-tool" data-sound-toggle aria-label="关闭声音" aria-pressed="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-5v16l-5-5H3Z"/><g class="sound-waves"><path d="M16 7a7 7 0 0 1 0 10m3-13a11 11 0 0 1 0 16"/></g><path class="sound-muted-mark" d="m16 9 6 6m0-6-6 6"/></svg><span class="sound-label sr-only">声音</span></button>
              <button class="battle-tool" id="pause-button" aria-label="暂停游戏"><span aria-hidden="true">Ⅱ</span><small>Esc</small></button>
            </nav>
            <div class="objective">
              <svg class="objective-frame" viewBox="0 0 240 120" preserveAspectRatio="none" aria-hidden="true"><path d="M7 1H233L239 7V113L233 119H1V7Z"/><path class="objective-frame-inner" d="M11 5H229L235 11V109L229 115H5V11Z"/><path class="objective-frame-corners" d="M1 14C8 14 14 8 14 1M1 8C5 8 8 5 8 1M226 1C226 8 232 14 239 14M232 1C232 5 236 8 239 8M1 106C8 106 14 112 14 119M1 112C5 112 8 115 8 119M226 119C226 112 232 106 239 106M232 119C232 115 236 112 239 112"/></svg>
              <div class="objective-content">
                <div class="objective-heading"><small id="hud-chapter">第一关</small></div>
                <div class="objective-goal"><svg class="objective-marker" viewBox="0 0 18 18" aria-hidden="true"><path d="m9 1 8 8-8 8-8-8Z"/><path d="m9 5 4 4-4 4-4-4Z"/></svg><strong id="hud-objective"></strong></div>
                <div class="objective-summary"><span class="hud-relics" id="hud-relics"></span><div class="journey-track" title="本幕路程"><i id="journey-progress"></i></div></div>
              </div>
            </div>
          </div>
        </div>
        <div class="boss-hud" id="boss-hud" hidden><div><span id="boss-name">逆发结罗</span><small id="boss-state">发丝结界</small></div><div class="boss-track"><i id="boss-health"></i></div></div>
        <div class="combat-bottom" id="combat-bottom" hidden>
          <button class="hud-jewel" id="hud-jewel" aria-label="查看四魂之玉争夺进度">
            <svg class="jewel-frame" viewBox="0 0 300 84" preserveAspectRatio="none" aria-hidden="true"><path d="M8 1H292L299 8V76L292 83H1V8Z"/><path class="jewel-frame-inner" d="M12 5H287L295 13V71L287 79H5V13Z"/><path class="jewel-frame-corners" d="M1 14C8 14 14 8 14 1M1 8C5 8 8 5 8 1M286 1C286 8 292 14 299 14M292 1C292 5 296 8 299 8M1 70C8 70 14 76 14 83M1 76C5 76 8 79 8 83M286 83C286 76 292 70 299 70M292 83C292 79 296 76 299 76"/></svg>
            <svg class="jewel-symbol" viewBox="0 0 48 72" aria-hidden="true"><defs><linearGradient id="hud-gem-body" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#d6a7ff"/><stop offset=".48" stop-color="#7775e7"/><stop offset="1" stop-color="#74e5ff"/></linearGradient><linearGradient id="hud-gem-light" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#e3eaff"/><stop offset="1" stop-color="#57d7f3"/></linearGradient></defs><path d="m26 3 14 20 2 20-17 26L7 51 8 31Z" fill="url(#hud-gem-body)" stroke="#ddf1ff" stroke-width=".8"/><path d="m26 3-14 29 16-2 8-6Z" fill="#b6a2ff"/><path d="m26 3 2 27 8-6Z" fill="#f0d5ff"/><path d="m36 24 6 19-14-13Z" fill="#4e63ce"/><path d="m12 32 16-2-3 23Z" fill="url(#hud-gem-light)"/><path d="m8 31 4 1-5 19Z" fill="#5d6bcb"/><path d="m12 32 13 21-18-2Z" fill="#264b97"/><path d="m7 51 18 2v16Z" fill="#319cdb"/><path d="m28 30 14 13-17 10Z" fill="#688ae8"/><path d="m42 43-17 26V53Z" fill="#b9f5ff"/><path d="m25 53-11-3 11 19Z" fill="#87e4ff"/><path d="m26 3 2 27-3 39M8 31l20-1 14 13" fill="none" stroke="#d3efff" stroke-opacity=".65" stroke-width=".7"/><path d="m36 18 1.6 4.4L42 24l-4.4 1.6L36 30l-1.6-4.4L30 24l4.4-1.6ZM13 43l1 2.7 2.7 1-2.7 1-1 2.7-1-2.7-2.7-1 2.7-1Z" fill="#f2fcff"/></svg>
            <span class="jewel-copy"><strong>四魂之玉</strong><span class="hud-jewel-track" aria-hidden="true"><i id="hud-jewel-fill"></i></span><span id="hud-jewel-shares"><span id="hud-jewel-sides" hidden><span class="jewel-side player">我方 <b id="hud-jewel-player">—</b></span><span class="jewel-share-divider" aria-hidden="true">·</span><span class="jewel-side enemy">敌方 <b id="hud-jewel-enemy">—</b></span></span><span id="hud-jewel-before">尚未玉碎</span></span></span>
          </button>
          <div class="action-cluster"><div class="skill-bar" aria-label="战斗行动">
            <button class="action-tile" id="basic-attack" data-input="attack" aria-label="普通攻击，可按住"><svg class="action-frame" viewBox="0 0 80 72" preserveAspectRatio="none" aria-hidden="true"><path d="M6 1H72L79 8V65L72 71H1V8Z"/><path class="frame-inner" d="M8 4H70L76 10V63L70 68H4V10Z"/><path class="frame-corners" d="M4 19V10L10 4H20M63 4H70L76 10V18M4 55V68H17M62 68H70L76 63V54"/></svg><kbd>J</kbd><span class="action-icon" id="basic-icon" aria-hidden="true"></span><span class="skill-name">普攻</span></button>
            <button class="action-tile" id="dodge-action" data-input="dodge" aria-label="闪避"><svg class="action-frame" viewBox="0 0 80 72" preserveAspectRatio="none" aria-hidden="true"><path d="M6 1H72L79 8V65L72 71H1V8Z"/><path class="frame-inner" d="M8 4H70L76 10V63L70 68H4V10Z"/><path class="frame-corners" d="M4 19V10L10 4H20M63 4H70L76 10V18M4 55V68H17M62 68H70L76 63V54"/></svg><kbd>K</kbd><span class="action-icon" id="dodge-icon" aria-hidden="true"></span><span class="skill-name">闪避</span></button>
            <button class="action-tile skill-button" id="skill1" data-input="skill1"><svg class="action-frame" viewBox="0 0 80 72" preserveAspectRatio="none" aria-hidden="true"><path d="M6 1H72L79 8V65L72 71H1V8Z"/><path class="frame-inner" d="M8 4H70L76 10V63L70 68H4V10Z"/><path class="frame-corners" d="M4 19V10L10 4H20M63 4H70L76 10V18M4 55V68H17M62 68H70L76 63V54"/></svg><kbd>U</kbd><span class="action-icon"><span class="skill-icon" aria-hidden="true"></span><span class="cooldown" aria-hidden="true"><b class="cooldown-value"></b></span></span><span class="skill-name">散魂铁爪</span></button>
            <button class="action-tile skill-button" id="skill2" data-input="skill2"><svg class="action-frame" viewBox="0 0 80 72" preserveAspectRatio="none" aria-hidden="true"><path d="M6 1H72L79 8V65L72 71H1V8Z"/><path class="frame-inner" d="M8 4H70L76 10V63L70 68H4V10Z"/><path class="frame-corners" d="M4 19V10L10 4H20M63 4H70L76 10V18M4 55V68H17M62 68H70L76 63V54"/></svg><kbd>I</kbd><span class="action-icon"><span class="skill-icon" aria-hidden="true"></span><span class="cooldown" aria-hidden="true"><b class="cooldown-value"></b></span></span><span class="skill-name">飞刃血爪</span></button>
          </div><div class="combat-hint"><span><kbd>Tab</kbd> 切换</span><button id="combat-help"><kbd>?</kbd> 操作</button></div></div>
        </div>
        <button class="scene-interaction" id="scene-interaction" data-input="interact" hidden><kbd>E</kbd><span id="scene-interaction-label"></span></button>
        <div class="dialogue" id="dialogue" hidden><div class="dialogue-portrait"><canvas id="dialogue-portrait" width="100" height="105"></canvas><span id="dialogue-symbol">✧</span></div><div class="dialogue-content"><div class="dialogue-heading"><strong id="dialogue-name"></strong><small id="dialogue-count"></small></div><p id="dialogue-text"></p><button id="dialogue-next">继续 <kbd>Enter</kbd> <span>▸</span></button></div></div>
        <div class="touch-controls" id="touch-controls" hidden><div class="touch-directions"><button data-input="left" aria-label="向左">◀</button><button data-input="down" aria-label="配合攻击上挑或下砸">↓</button><button data-input="right" aria-label="向右">▶</button></div><div class="touch-actions"><button data-input="skill1" id="touch-skill1" aria-label="第一技能">技能一</button><button data-input="skill2" id="touch-skill2" aria-label="第二技能">技能二</button><button data-input="dodge" aria-label="闪避">闪避</button><button data-input="switch" aria-label="切换角色">切换</button><button data-input="jump" aria-label="跳跃">跳跃</button><button data-input="attack" aria-label="普通攻击，可按住">攻击</button></div></div>
      </div>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="panel" aria-labelledby="panel-title"><div class="panel-top"><div><small id="panel-eyebrow">THE JOURNEY</small><h2 id="panel-title">章节</h2></div><button class="icon-button close-panel" id="panel-close" aria-label="关闭">×</button></div><nav class="journal-tabs" id="journal-tabs" role="tablist" aria-label="旅途手记" hidden><button role="tab" data-journal="journey" aria-controls="panel-content">旅程</button><button role="tab" data-journal="heroes" aria-controls="panel-content">伙伴</button><button role="tab" data-journal="jewel" aria-controls="panel-content">四魂之玉</button><button role="tab" data-journal="bestiary" aria-controls="panel-content">妖怪图鉴</button><button role="tab" data-journal="settings" aria-controls="panel-content">设置</button></nav><div id="panel-content"></div><div class="journal-footer" id="journal-footer" hidden><button class="button primary" id="journal-resume">继续旅程 →</button><button class="button secondary" id="journal-retry">从检查点重试</button><button class="journal-home" id="journal-home">返回首页</button></div></dialog>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
